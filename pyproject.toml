[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-video-summarizer"
version = "1.0.0"
description = "Local-capable video-to-summary pipeline: download -> extract -> transcribe -> summarize"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
forge-video-summarizer = "forge_video_summarizer.cli:main"
fvs = "forge_video_summarizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
