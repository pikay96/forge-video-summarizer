[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-video-summarizer"
version = "1.0.0"
description = "Local-capable video-to-summary pipeline: download -> extract -> transcribe -> summarize -> export"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "notion-client>=2.2",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
forge-video-summarizer = "forge_video_summarizer.cli:main"
fvs = "forge_video_summarizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forge_video_summarizer = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "RET", "C4", "PIE"]
ignore = ["B008"]  # allow function calls in argument defaults where intentional

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]  # pytest fixtures often appear as unused arguments
